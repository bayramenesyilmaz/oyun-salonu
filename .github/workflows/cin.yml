name: cin
on:
  push:
    branches: [varliklar]
    paths: ['tools/render/cin_*.py', '.github/workflows/cin.yml']
permissions:
  contents: write
concurrency: cin
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        scene: [salon, portre]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Blender (bpy) kur
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libegl1 > /dev/null
          pip install -q bpy==5.0.1 numpy pillow
      - name: Çiz
        run: |
          mkdir -p out
          if [ "${{ matrix.scene }}" = salon ]; then
            KS_WIDTH=1920 python tools/render/cin_salon.py -- out/salon.png 2>&1 | grep -vE "WARNING: User property|^Info|INFO:" | tail -30
          else
            python tools/render/cin_portre.py -- out/portre 2>&1 | grep -vE "WARNING: User property|^Info|INFO:" | tail -30
          fi
          ls -laR out
      - uses: actions/upload-artifact@v4
        with:
          name: cin-${{ matrix.scene }}
          path: out/
  kaydet:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Kaydet
        run: |
          pip install -q pillow
          mkdir -p renders/cin
          python3 - <<'PY'
          import glob, os, shutil
          from PIL import Image
          for f in glob.glob('dl/**/*.png', recursive=True):
              n = os.path.basename(f)[:-4]
              im = Image.open(f).convert('RGB')
              im.save(f'renders/cin/{n}.jpg', quality=90)
              print(n, im.size)
          for f in glob.glob('dl/**/*.json', recursive=True):
              shutil.copy(f, 'renders/cin/')
          PY
          git config user.name "varlik-botu"
          git config user.email "actions@users.noreply.github.com"
          git add renders/cin
          git commit -m "Cin vakaları görselleri çizildi [skip ci]" || true
          git pull --rebase -q origin varliklar && git push
