name: tts
on:
  push:
    branches: [varliklar]
    paths: ['tools/tts/**', '.github/workflows/tts.yml']
permissions:
  contents: write
concurrency: tts
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Kur
        run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts
          sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Üret
        env:
          SHARD: ${{ matrix.shard }}
          NSHARD: 6
        run: |
          touch /tmp/stamp && sleep 1
          for G in $(ls tools/tts/*_lines.json | xargs -n1 basename | sed 's/_lines.json//'); do
            python tools/tts/gen_lines.py $G 2>&1 | grep -v Warning | tail -40
            mkdir -p new/$G && find tts-out/$G -name '*.mp3' -newer /tmp/stamp -exec cp {} new/$G/ \;
          done
          find new -name '*.mp3' | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: tts-${{ matrix.shard }}
          path: new/
          if-no-files-found: ignore
  kaydet:
    needs: tts
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Kaydet
        run: |
          for d in dl/*/*/; do G=$(basename $d); mkdir -p tts-out/$G; cp $d*.mp3 tts-out/$G/ 2>/dev/null || true; done
          python3 -c "import os,json; [json.dump({'voices':'Chatterbox Multilingual (MIT); erkek referansları Piper tr_TR (CC0)','files':sorted(f[:-4] for f in os.listdir('tts-out/'+g) if f.endswith('.mp3'))}, open('tts-out/'+g+'/manifest.json','w')) for g in os.listdir('tts-out')]"
          git config user.name "varlik-botu"
          git config user.email "actions@users.noreply.github.com"
          git add tts-out
          git commit -m "Seslendirme üretildi [skip ci]" || true
          git pull --rebase -q origin varliklar && git push
