name: tts
on:
  push:
    branches: [varliklar]
    paths: ['tools/tts/**', '.github/workflows/tts.yml']
permissions:
  contents: write
concurrency: tts
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Kur
        run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts
          sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Üret
        run: python tools/tts/gen_lines.py kusyolu 2>&1 | grep -v Warning | tail -80
      - name: Kaydet
        run: |
          git config user.name "varlik-botu"
          git config user.email "actions@users.noreply.github.com"
          git add tts-out
          git commit -m "Seslendirme üretildi [skip ci]" || true
          git pull --rebase -q origin varliklar && git push
