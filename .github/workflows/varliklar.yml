name: varliklar
on:
  push:
    branches: [varliklar]
    paths: ['tools/assets/*.py', 'tools/assets/*.json', 'tools/assets/*.sh', '.github/workflows/varliklar.yml']
permissions:
  contents: write
concurrency: varliklar
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: İndir
        run: |
          pip install -q pillow
          python3 tools/assets/fetch.py
          du -sh assets-src/* | tee tools/assets/out/sizes.txt
      - name: Kaydet
        run: |
          git config user.name "varlik-botu"
          git config user.email "actions@users.noreply.github.com"
          git add tools/assets/out assets-src
          git commit -m "Varlıklar indirildi [skip ci]" || true
          git pull --rebase -q origin varliklar && git push
