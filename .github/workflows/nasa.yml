name: nasa
on:
  push:
    branches: [varliklar]
    paths: ['tools/space/**', '.github/workflows/nasa.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: İndir
        run: |
          pip install -q pillow
          bash tools/space/fetch_nasa.sh
          cat assets-src/space/SOURCES.txt
      - name: Kaydet
        run: |
          git config user.name "varlik-botu"
          git config user.email "actions@users.noreply.github.com"
          git add assets-src/space
          git commit -m "NASA dokuları indirildi [skip ci]" || true
          git pull --rebase -q origin varliklar && git push
